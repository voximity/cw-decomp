[package]
name = "cw-cli"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "cwtool: inspect and extract Cube World Alpha data"

[[bin]]
name = "cwtool"
path = "src/main.rs"

[dependencies]
cw-formats = { path = "../cw-formats" }
cw-world = { path = "../cw-world" }
clap = { version = "4", features = ["derive"] }

[dev-dependencies]
rusqlite.workspace = true
