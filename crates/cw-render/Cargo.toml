[package]
name = "cw-render"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Cube World Alpha renderer on wgpu (Tier C: the plasma D3D9 layer reimplemented)"

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
cw-formats = { path = "../cw-formats" }
cw-math = { path = "../cw-math" }
cw-net = { path = "../cw-net" }
cw-sim = { path = "../cw-sim" }
cw-world = { path = "../cw-world" }
glam = "0.33.8"
image = { version = "0.25.10", default-features = false, features = ["png"] }
wgpu = "30.0.1"

[dev-dependencies]
naga = { version = "30.0.1", features = ["wgsl-in"] }
